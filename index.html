<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111113" />
    <title>فهرست من</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app">
      <div id="lists" class="lists"></div>
      <div class="app-actions"><button id="delete-all" type="button" class="delete-all">حذف همه</button></div>
      <div hidden><span id="save-dot"></span><span id="save-status"></span></div>

      <div class="backup-bar" hidden>
        <button type="button" id="connect-file" class="text-button">اتصال فایل TXT</button>
        <span class="separator" aria-hidden="true"></span>
        <button type="button" id="export-file" class="text-button">خروجی TXT</button>
        <button type="button" id="import-file" class="text-button">بازیابی فایل</button>
        <input id="file-input" type="file" accept=".txt,.json,text/plain,application/json" hidden />
      </div>
    </main>

    <template id="list-template">
      <section class="card">
        <input class="list-title" type="text" maxlength="80" placeholder="عنوان فهرست" aria-label="عنوان فهرست" autocomplete="off" />
        <form class="add-form" novalidate>
          <input class="item-input" name="item" type="text" placeholder="مورد جدید…" aria-label="مورد جدید" maxlength="500" autocomplete="off" />
          <button class="add-button" type="submit" aria-label="افزودن مورد" title="افزودن"><span aria-hidden="true">+</span></button>
        </form>
        <div class="list-scroll"><ol class="items" aria-label="موارد فهرست"></ol></div>
      </section>
    </template>

    <template id="item-template">
      <li class="item">
        <button class="drag-handle" type="button" aria-label="جابه‌جایی مورد؛ با کلیدهای بالا و پایین نیز قابل انجام است" title="بکشید یا از کلیدهای ↑ و ↓ استفاده کنید">
          <svg viewBox="0 0 16 24" width="16" height="24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="6" r="1.5"/><circle cx="11" cy="6" r="1.5"/><circle cx="5" cy="12" r="1.5"/><circle cx="11" cy="12" r="1.5"/><circle cx="5" cy="18" r="1.5"/><circle cx="11" cy="18" r="1.5"/></svg>
        </button>
        <span class="item-text"></span>
        <button class="delete-button" type="button" title="حذف مورد">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5M14 11v5"/></svg>
        </button>
      </li>
    </template>

    <div id="toast" class="toast" role="status" hidden><span id="toast-message"></span><button id="undo" type="button" hidden>بازگردانی</button><button id="toast-close" class="toast-close" type="button" aria-label="بستن پیام">×</button></div>
    <div id="announcement" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
